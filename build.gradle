plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // accessories-fabric built from ../Accessories-26.2 (publishToMavenLocal); its Gradle module metadata describes the
    // disabled plain jar, so only the POM is read
    mavenLocal {
        metadataSources {
            mavenPom()
            ignoreGradleMetadataRedirection()
        }
    }
    maven { url = 'https://maven.wispforest.io/releases' } // owo-lib, endec
    maven { url = 'https://maven.shedaniel.me/' } // cloth config, REI
    maven { url = 'https://maven.terraformersmc.com/releases' } // mod menu
    maven { url = 'https://maven.blamejared.com/' } // JEI
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://jitpack.io' } // kdl4j (owo-lib dependency)
    maven { url = 'https://maven.nucleoid.xyz' } // server translations api (owo-lib dependency)
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "io.wispforest:accessories-fabric:${project.accessories_version}"
    implementation "io.wispforest:owo-lib:${project.owo_version}"

    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    compileOnly "mezz.jei:jei-${project.jei_minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.jei_minecraft_version}-fabric-api:${project.jei_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/beachparty.accesswidener")
}

// TODO(26.2): REI/JEI integrations still use the pre-1.21.2 recipe API (getIngredients / RecipeManager on the client);
// they need to be rewritten around RecipeDisplay before they can come back
sourceSets {
    main {
        java {
            exclude("**/compat/rei/**")
            exclude("**/compat/jei/**")
        }
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = project.java_version.toInteger()
    it.options.compilerArgs << "-Xmaxerrs" << "10000"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
